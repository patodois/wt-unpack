name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  library:
    name: Library and CLI (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p wt-unpack --release
      # Game-data tests skip themselves without WT_GAME_DIR; CI has no game files
      - run: cargo test -p wt-unpack
      # The optional live telemetry client and rewrite-bridge provider
      - run: cargo test -p wt-unpack --features live,bridge

  viewer:
    name: Viewer (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p wt-viewer
