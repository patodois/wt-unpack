[package]
name = "wt-unpack"
version = "0.1.0"
edition = "2021"
description = "Reader for Dagor Engine vromfs archives and binary BLK files (War Thunder game data)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
meshopt = "0.7.0"
oozextract = "0.5.5"
serde_json = { version = "1", features = ["preserve_order"] }
zstd = "0.13"
# Texture decoding from the wt_blk PR (Warthunder-Open-Source-Foundation/wt_blk#28); switch to git/crates.io once merged
wt_blk = { path = "../wt-contrib/wt_blk", features = ["png"] }
flate2 = "1.1.10"
png = "0.18.1"

[workspace]
members = ["viewer"]

# Bevy is slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"
