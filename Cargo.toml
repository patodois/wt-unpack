[package]
name = "wt-unpack"
version = "0.5.1"
edition = "2021"
description = "Reader for Dagor Engine vromfs archives and binary BLK files (War Thunder game data)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/patodois/wt-unpack"
keywords = ["war-thunder", "dagor", "gamedev", "assets", "gltf"]
categories = ["game-development", "parser-implementations"]
# the fuzz crate is nightly-only and not part of the published package, and neither are process notes or reviews
exclude = ["/fuzz", "/CLOUD-REPORT.md", "/docs/reviews"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
# zstd frames of the archives, BLKs and level blocks (pure Rust)
ruzstd = "0.8"
# GRP model packs, DXP texture packs, DDSx textures, DynModels and skeletons
wt-formats = { version = "0.1.0", features = ["png"] }
png = "0.18.1"
# Oodle streams inside level files, clean-room (the same decoder wt-formats uses; github.com/patodois/lztans)
lztans = "0.1.1"
lewton = { version = "0.10.2", default-features = false }
memmap2 = "0.9"
# Blocking HTTP client for the live telemetry poller (plain HTTP to localhost only, so no TLS)
ureq = { version = "3.5", default-features = false, optional = true }
# The bridge to other game rewrites (see src/bridge.rs, github.com/patodois/rewrite-bridge), and the
# peak memory report of `check-bridge`
rewrite-bridge = { version = "0.4", optional = true }

[dev-dependencies]
# to build zstd frames, with and without a dictionary, in the tests
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
# `wt-unpack live`: poll the game's read-only telemetry API on localhost:8111
live = ["dep:ureq"]
bridge = ["dep:rewrite-bridge", "dep:libc"]

[[example]]
name = "render_scene"
required-features = ["bridge"]

[[example]]
name = "drive_tank"
required-features = ["bridge"]

[[example]]
name = "scene_memory"
required-features = ["bridge"]

[[example]]
name = "vehicle_memory"
required-features = ["bridge"]

[workspace]
members = ["viewer"]

# Bevy is slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"
