[package]
name = "wt-unpack"
version = "0.1.0"
edition = "2021"
description = "Reader for Dagor Engine vromfs archives and binary BLK files (War Thunder game data)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
zstd = "0.13"
# Texture and model readers from Warthunder-Open-Source-Foundation/wt_blk#28 and #29 (fork branch);
# switch to crates.io once they are released
wt_blk = { git = "https://github.com/patodois/wt_blk", rev = "498c996d30e95eac334d33bb7cdcc9ff88e16799", features = ["png"] }
png = "0.18.1"
# Oodle streams inside level files (the same decoder wt_blk uses)
oozextract = "0.5.6"
lewton = { version = "0.10.2", default-features = false }
memmap2 = "0.9"
# Blocking HTTP client for the live telemetry poller (plain HTTP to localhost only, so no TLS)
ureq = { version = "3.5", default-features = false, optional = true }
# The bridge to other game rewrites (see src/bridge.rs, github.com/patodois/rewrite-bridge), and the
# peak memory report of `check-bridge`
rewrite-bridge = { git = "https://github.com/patodois/rewrite-bridge", rev = "1b5820180efbd585916ab206e6bcbbcf33096e1e", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
# `wt-unpack live`: poll the game's read-only telemetry API on localhost:8111
live = ["dep:ureq"]
bridge = ["dep:rewrite-bridge", "dep:libc"]

[[example]]
name = "render_scene"
required-features = ["bridge"]

[[example]]
name = "drive_tank"
required-features = ["bridge"]

[[example]]
name = "scene_memory"
required-features = ["bridge"]

[workspace]
members = ["viewer"]

# Bevy is slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"
