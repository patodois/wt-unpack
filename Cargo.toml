[package]
name = "wt-unpack"
version = "0.1.0"
edition = "2021"
description = "Reader for Dagor Engine vromfs archives and binary BLK files (War Thunder game data)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
zstd = "0.13"
# Texture and model readers from Warthunder-Open-Source-Foundation/wt_blk#28 and #29 (fork branch);
# switch to crates.io once they are released
wt_blk = { git = "https://github.com/patodois/wt_blk", rev = "c7fd584a73384f8de70c76b6a5635f47f42986dc", features = ["png"] }
png = "0.18.1"
# Blocking HTTP client for the live telemetry poller (plain HTTP to localhost only, so no TLS)
ureq = { version = "3.5", default-features = false, optional = true }

[features]
# `wt-unpack live`: poll the game's read-only telemetry API on localhost:8111
live = ["dep:ureq"]

[workspace]
members = ["viewer"]

# Bevy is slow without optimisations; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
# Dependency debug info is large (Bevy) and rarely needed
debug = false

[profile.dev]
debug = "line-tables-only"

# oozextract 0.5.5 on crates.io lacks the fix for valid streams it rejected (lvlvllvlvllvlvl/oozextract#3);
# use the fixed revision until a release is out (lvlvllvlvllvlvl/oozextract#5)
[patch.crates-io]
oozextract = { git = "https://github.com/lvlvllvlvllvlvl/oozextract", rev = "71ca5f5" }
