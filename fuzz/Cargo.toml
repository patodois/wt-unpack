[package]
name = "wt-unpack-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "cargo-fuzz targets for the readers of wt-unpack (nightly only; not part of the stable build)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
# the bytes of a few seed inputs and the table of Vorbis setup CRCs
zstd = "0.13"

[dependencies.wt-unpack]
path = ".."

# Its own workspace: the fuzz crate stays out of the stable workspace build (and its lock file stays here)
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "make_seeds"
path = "src/make_seeds.rs"
test = false
doc = false

[[bin]]
name = "vromfs"
path = "fuzz_targets/vromfs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blk"
path = "fuzz_targets/blk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blk_namemap"
path = "fuzz_targets/blk_namemap.rs"
test = false
doc = false
bench = false

